<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>L.A TK · Talonario de cobro</title>
<style>
  @page { size: A4; margin: 8mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Inter", "Segoe UI", Arial, sans-serif; color: #111; font-size: 9.5pt; }
  .sheet { display: flex; flex-direction: column; height: 281mm; }
  .slip { flex: 1; display: flex; border-bottom: 1.2px dashed #8a94a3; padding: 4mm 0; position: relative; }
  .slip:last-child { border-bottom: none; }
  .slip::after { content: "✂"; position: absolute; left: -1mm; bottom: -3.2mm; font-size: 9pt; color: #8a94a3; background: #fff; }
  .slip:last-child::after { display: none; }
  .stub { width: 58mm; padding-right: 4mm; border-right: 1.2px dashed #8a94a3; display: flex; flex-direction: column; gap: 2.4mm; }
  .main { flex: 1; padding-left: 5mm; display: flex; flex-direction: column; gap: 2.6mm; }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 2mm; }
  .brand img { width: 8mm; height: 8mm; border-radius: 1.6mm; }
  .brand b { font-size: 13pt; letter-spacing: .3px; }
  .brand span { display: block; font-size: 7.5pt; color: #555; }
  .tag { font-size: 7pt; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #fff; background: #1971ff; padding: .8mm 2mm; border-radius: 1mm; }
  .tag.stubtag { background: #495057; }
  .row { display: flex; gap: 3mm; align-items: flex-end; }
  .f { flex: 1; display: flex; align-items: flex-end; gap: 1.5mm; white-space: nowrap; }
  .f label { color: #444; font-size: 8.5pt; }
  .f .line { flex: 1; border-bottom: 1px solid #333; height: 4.6mm; }
  .f.w0 { flex: 0 0 auto; }
  .w12 .line { width: 12mm; flex: 0 0 12mm; }
  .w22 .line { width: 22mm; flex: 0 0 22mm; }
  .amount { display: flex; align-items: center; gap: 2mm; }
  .amount .box { border: 1.4px solid #111; border-radius: 1.5mm; height: 9mm; flex: 0 0 42mm; display: flex; align-items: center; padding-left: 2mm; font-weight: 800; font-size: 12pt; }
  .note { font-size: 7.3pt; color: #555; margin-top: auto; }
  .check { display: inline-block; width: 3mm; height: 3mm; border: 1px solid #333; vertical-align: middle; margin-right: 1mm; }
</style>
</head>
<body>
<div class="sheet">
  <!--SLIPS-->
</div>
</body>
</html>
